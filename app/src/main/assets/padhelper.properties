# PAD Helper 默认配置（随模块一起安装，无需 root）
# 设备上有 root 时也可以放到 /data/data/jp.gungho.pad/padhelper/config.properties，覆盖这里的值。

# ---- 背景音乐 ----
# 是否启用 BGM 替换
bgm.enabled = true

# 无损替换：游戏请求 bgm_012.ogg 时，如果 <bgm.dir>/bgm_012.ogg 存在，就用你的本地文件播放。
# 把任意音频（ogg 最稳，ExoPlayer 也支持 mp3/m4a）按原文件名放进去即可。
bgm.dir = /sdcard/PADHelper/bgm

# 资源互换：把 A 换成本地已解压的另一个 BGM（值必须是游戏 assets 里真实存在的名字）
# 例：bgm.swap.bgm_001.ogg = bgm_014.ogg
# bgm.swap.bgm_001.ogg = bgm_014.ogg

# ---- 皮肤（实验性）----
# 皮肤数据（skci_/skse_ 与 st_*.txt）与角色绑定，单独换文件只影响本地显示，默认关闭。
skin.enabled = false
# 例：skin.swap.skci_0001.bin = skci_0002.bin
